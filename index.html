<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0a0e27" />
    <title>QIXXX</title>
    <meta name="description" content="1プレイ3分。線を引いて陣地を切り取る、ネオン風の陣取りアクションゲーム。ブラウザで無料、PC・スマホ対応。" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="QIXXX" />
    <meta property="og:description" content="1プレイ3分。線を引いて陣地を切り取る、ネオン風の陣取りアクションゲーム。ブラウザで無料、PC・スマホ対応。" />
    <meta property="og:url" content="https://qixxx.orukubami.sh/" />
    <meta property="og:image" content="https://qixxx.orukubami.sh/og-image.png?v=040" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0a0e27;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
      }

      /* #game-root (created by main.ts) fills the space above the controls
         in bottom mode or the center column in side mode. It stacks #hud-row
         directly above #canvas-wrap, and main.ts letterboxes the canvas while
         keeping the HUD row at the same width. The screen overlay is centered
         over the canvas by its positioning inside #canvas-wrap. */
      #touch-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 8px;
        width: 100%;
      }

      #touch-actions {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        flex: 0 0 auto;
      }

      #touch-actions-extra {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
      }

      #touch-actions-extra:empty {
        display: none;
      }

      body[data-touch-layout='side'] {
        display: grid;
        grid-template-columns: var(--touch-side-w) minmax(0, 1fr) var(--touch-side-w);
        grid-template-rows: minmax(0, 1fr);
        grid-template-areas: 'dpad game actions';
        align-items: center;
      }

      body[data-touch-layout='side'] #touch-controls {
        display: contents;
      }

      body[data-touch-layout='side'] #touch-dpad {
        grid-area: dpad;
        justify-self: start;
        margin-left: 8px;
      }

      body[data-touch-layout='side'] #touch-actions {
        grid-area: actions;
        justify-self: end;
        margin-right: 8px;
      }

      body[data-touch-layout='side'] #game-root {
        grid-area: game;
        align-self: stretch;
        height: 100%;
        min-width: 0;
        min-height: 0;
      }

      #game-canvas {
        display: block;
        border: 2px solid #00ff41;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

    </style>
  </head>
  <body>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
