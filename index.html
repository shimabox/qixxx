<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0a0e27" />
    <title>QIXXX</title>
    <meta name="description" content="1プレイ3分。線を引いて陣地を切り取る、ネオン風の陣取りアクションゲーム。ブラウザで無料、PC・スマホ対応。" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="QIXXX" />
    <meta property="og:description" content="1プレイ3分。線を引いて陣地を切り取る、ネオン風の陣取りアクションゲーム。ブラウザで無料、PC・スマホ対応。" />
    <meta property="og:url" content="https://qixxx.orukubami.sh/" />
    <meta property="og:image" content="https://qixxx.orukubami.sh/og-image.png?v=040" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* The impact feedback's display face, bundled with the game
         (public/fonts/, SIL Open Font License 1.1 — see Orbitron-OFL.txt).
         Text falls back to monospace until it has loaded. */
      @font-face {
        font-family: "Orbitron";
        src: url('/fonts/Orbitron-wght.ttf') format('truetype');
        font-weight: 400 900;
        font-display: swap;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0a0e27;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        /* A game screen has no text to select. Holding a touch control on
           iOS would otherwise start a text selection / callout on nearby
           text; Safari needs the -webkit- prefixed properties. */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      input,
      textarea {
        -webkit-user-select: text;
        user-select: text;
      }

      /* #game-root (created by main.ts) fills the space above the controls
         in bottom mode or the center column in side mode. It stacks #hud-row
         directly above #canvas-wrap, and main.ts letterboxes the canvas while
         keeping the HUD row at the same width. The screen overlay is centered
         over the canvas by its positioning inside #canvas-wrap. */
      #touch-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: var(--touch-bottom-pad-y) 8px;
        width: 100%;
      }

      #touch-actions {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        flex: 0 0 auto;
      }

      #touch-actions-extra {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
      }

      #touch-actions-extra:empty {
        display: none;
      }

      /* Bottom mode: the extras hold only the PAUSE button, pinned to the
         control row's bottom-right corner below FAST / SLOW and out of the
         flow, so showing or hiding it never moves the other controls. */
      body:not([data-touch-layout='side']) #touch-controls {
        position: relative;
      }

      body:not([data-touch-layout='side']) #touch-actions-extra {
        position: absolute;
        right: 8px;
        bottom: 8px;
      }

      #touch-dpad {
        position: relative;
      }

      #touch-dpad::before {
        content: '';
        position: absolute;
        inset: calc(-1 * var(--touch-dpad-hit-margin));
      }

      #touch-dpad button {
        pointer-events: none;
      }

      body[data-touch-layout='side'] {
        display: grid;
        grid-template-columns: var(--touch-side-w) minmax(0, 1fr) var(--touch-side-w);
        grid-template-rows: minmax(0, 1fr);
        grid-template-areas: 'dpad game actions';
        align-items: center;
      }

      body[data-touch-layout='side'] #touch-controls {
        display: contents;
      }

      body[data-touch-layout='side'] #touch-dpad {
        grid-area: dpad;
        justify-self: start;
        margin-left: var(--touch-side-pad);
      }

      body[data-touch-layout='side'] #touch-actions {
        grid-area: actions;
        justify-self: start;
        margin-left: var(--touch-side-pad);
      }

      /* In side mode the HUD extras stay fixed in the viewport's top-right
         corner, separate from the FAST/SLOW cluster beside the field. */
      body[data-touch-layout='side'] #touch-actions-extra {
        position: fixed;
        top: 6px;
        right: 8px;
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 8px;
      }

      body[data-touch-layout='side'] #touch-actions-extra:empty {
        display: none;
      }

      body[data-touch-layout='side'] #mute-button {
        font-size: 11px !important;
        padding: 2px 8px !important;
        /* Not the HUD row's height (src/main.ts's getMuteButtonElement()). */
        min-height: 0 !important;
        line-height: 1.4;
      }

      body[data-touch-layout='side'] #credit-link {
        font-size: 10px !important;
      }

      /* Side mode: the PAUSE button sits left of the credit, top-aligned and
         out of the row's flow, so the taller button never moves the credit
         and MUTE. */
      body[data-touch-layout='side'] #pause-button {
        position: absolute;
        top: 0;
        right: calc(100% + 8px);
      }

      /* A side layout with a narrow center column (main.ts sets the
         attribute and --touch-narrow-side-hud-font) shrinks the HUD so its
         lines fit the field-wide HUD row. */
      body[data-touch-layout='side'][data-touch-narrow-side] #hud {
        font-size: var(--touch-narrow-side-hud-font) !important;
      }

      body[data-touch-layout='side'] #game-root {
        grid-area: game;
        align-self: stretch;
        height: 100%;
        min-width: 0;
        min-height: 0;
      }

      #game-canvas {
        display: block;
        border: 2px solid #00ff41;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      /* While the sound is off on the live Title screen, the sound toggle
         glows slowly in the HUD accent color (--sound-glow, set by
         src/main.ts). A box-shadow only: the button's box never moves. */
      @keyframes sound-attention {
        0%,
        100% {
          box-shadow: 0 0 2px 0 var(--sound-glow);
        }
        50% {
          box-shadow: 0 0 10px 3px var(--sound-glow);
        }
      }

      #mute-button[data-attention='true'] {
        box-shadow: 0 0 8px 2px var(--sound-glow);
        animation: sound-attention 1.6s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        #mute-button[data-attention='true'] {
          animation: none;
        }
      }

      /* After the GAME OVER screen suggested EASY, the Title screen's MODE
         button (src/ui/difficultyToggle.ts) keeps its text lit (set there)
         and a glow around it, pulsing --difficulty-pulse-count times — lit
         and still under prefers-reduced-motion: reduce. A text-shadow only:
         the button's box never moves. Its numbers come from src/config.ts
         (EASY_PROMPT_TOGGLE_*), set on the button. */
      @keyframes difficulty-attention {
        0%,
        100% {
          text-shadow: 0 0 var(--difficulty-glow-rest-blur) var(--difficulty-glow);
        }
        50% {
          text-shadow: 0 0 var(--difficulty-glow-peak-blur) var(--difficulty-glow);
        }
      }

      #difficulty-button[data-attention='true'] {
        text-shadow: 0 0 var(--difficulty-glow-rest-blur) var(--difficulty-glow);
        animation: difficulty-attention var(--difficulty-pulse-sec) ease-in-out var(--difficulty-pulse-count);
      }

      @media (prefers-reduced-motion: reduce) {
        #difficulty-button[data-attention='true'] {
          animation: none;
        }
      }

    </style>
  </head>
  <body>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
