# Hourly backup for the five-minute launchd ranking audit. The D1 lock and
# fenced writes make overlapping invocations safe. Follow
# docs/ranking-audit-runbook.md before enabling scheduled runs.
name: Ranking async audit

on:
  workflow_dispatch: {}
  schedule:
    - cron: '23 * * * *'

concurrency:
  group: ranking-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.AUDIT_CRON_ENABLED == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # PUBLIC LOG. Do not enable message-detail logging or print environment,
      # request, row, or error objects. See docs/ranking-audit-runbook.md.
      - name: Run async audit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          RANKING_IP_HASH_KEY: ${{ secrets.RANKING_IP_HASH_KEY }}
          AUDIT_CRON_ENABLED: ${{ vars.AUDIT_CRON_ENABLED }}
        run: npm run ranking:remote:audit
