name = "qixxx"
# Pinned to the newest date the locally-installed wrangler@3.114.17's
# bundled Workers runtime actually supports (a newer date here just falls
# back to this one anyway, with a warning) — production Pages deployments
# use whatever wrangler/runtime version Cloudflare's dashboard build runs,
# independent of this local-dev pin.
compatibility_date = "2025-07-18"

# Build output root: matches vite.config.ts's build.outDir ('dist'), which
# the app serves from at the root of its own subdomain (qixxx.orukubami.sh).
pages_build_output_dir = "dist"

# KV namespace bindings for the SHARES binding. When this wrangler.toml is
# deployed to Cloudflare Pages, it becomes the source of truth for all KV
# bindings — the id below is the actual qixxx-shares namespace ID and is used
# for both production and preview deployments. Local development with
# `wrangler pages dev` still uses the local KV emulation (backed by on-disk
# sqlite under .wrangler/, gitignored), independent of this id. The id is not
# a secret (it requires Cloudflare account authentication to be used).
[[kv_namespaces]]
binding = "SHARES"
id = "6c911969b6e94e5d90ea71ca6ab529dd"

# D1 binding for the score-ranking feature (docs/plans/2026-08-16-score-
# ranking task 3). `database_id` below is a placeholder, NOT a real
# Cloudflare resource — `wrangler pages dev` / `wrangler d1 migrations apply`
# happily create a purely local SQLite-backed D1 under .wrangler/state/ for
# ANY database_id string, with zero Cloudflare account calls, which is
# exactly what task 3 asks for ("実 D1 の作成・binding は不要"). This must be
# replaced with the real id `wrangler d1 create qixxx-scores` prints out
# before any real (non-local) deploy — see docs/ranking-runbook.md's
# deploy-prep steps, which this round deliberately stops short of (task 7's
# stop point).
[[d1_databases]]
binding = "DB"
database_name = "qixxx-scores"
database_id = "00000000-0000-0000-0000-000000000000"

# CPU time ceiling — a denial-of-wallet / runaway brake, not a tuning knob.
#
# 5000 = ~2x the measured worst-case combination, per the plan's "実測 p99 の
# 2倍程度" guidance. From docs/ranking-cpu-measurement.md §4.3 (single-process,
# strictly serial, 2026-08-17): p99(A) 41.51ms + max(B-success 1,563.73ms,
# B-rejected 2,311.17ms) = 2,352.68ms, doubled and rounded up.
#
# Two earlier values are superseded. 2000 predates any full measurement and
# now sits below the measured p99. 6000 came from a local HTTP wall-clock run
# that has since been withdrawn as invalid — three copies of that harness ran
# concurrently and contaminated each other (§3 of the same document).
#
# IMPORTANT: even 5000 rests on a proxy. The measurement is in-process
# wall-clock of the verification core — the dominant cost, but a LOWER bound
# on per-request CPU (it excludes hashing, D1 and response generation) — and
# it is not the CPU time Cloudflare meters. It is also worth noting how far
# this sits above realistic traffic: an ordinary run verifies in 96.41ms p99,
# ~24x under this ceiling. Re-measure real CPU time on a Paid preview and
# retighten to ~2x that p99. Deliberately generous rather than tight: the
# failure mode of "too low" is rejecting real players' runs.
#
# This is a Workers Paid-plan setting (max 300000, default 30000 when unset)
# that only takes effect on Cloudflare's edge under a Paid plan. Locally,
# `wrangler pages dev`'s Miniflare/workerd does not enforce a request CPU cap
# at all, so this key has no effect on local dev either way.
[limits]
cpu_ms = 5000
